<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIPX DEVIL | AI Terminal</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="app-container">

    <aside class="sidebar">
        <div class="brand">DIPX<br><span class="accent-text">DEVIL</span></div>

        <nav class="nav-menu">
            <div class="nav-item active"><i data-lucide="terminal"></i></div>
            <div class="nav-item" id="settings-trigger"><i data-lucide="settings"></i></div>
        </nav>
    </aside>

    <main class="main-content">

        <header>
            <h1><span class="accent-text">LIVE_AI:</span> ONLINE</h1>
            <div class="status-pill">
                <div class="dot"></div> ENCRYPTED
            </div>
        </header>

        <div id="chat-container">
            <div class="message ai-message typing">System Booted... Awaiting input.</div>
        </div>

        <div class="input-area">
            <textarea id="user-input" placeholder="Type your command..."></textarea>
            <button id="send-btn"><i data-lucide="send"></i></button>
        </div>

    </main>

</div>

<!-- MODAL -->
<div id="settings-modal" class="modal hidden">
    <div class="modal-content">
        <h2>API ACCESS</h2>
        <input type="password" id="api-key-input" placeholder="Enter API Key">
        <div class="modal-btns">
            <button id="save-key-btn">SAVE</button>
            <button id="close-modal">CANCEL</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
